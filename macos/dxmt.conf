# DXMT options for 3ds Max (loaded through DXMT_CONFIG_FILE, see run-3dsmax.sh)
# Nitrous treats DXMT's default adapter (vendor 0x106B, device 0) as "no GPU" and falls back
# to its WARP software path, whose stream-output shaders DXMT can't run: report a Radeon instead.
dxgi.customVendorId = 1002
dxgi.customDeviceId = 73bf
dxgi.customDeviceDesc = "AMD Radeon RX 6800 XT"
